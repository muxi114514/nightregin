# 逐级属性分配方案（放在 nr_stat_alloc.dll 同目录）
# 推荐在游戏里编辑：遗物装配界面右上角"属性分配"（或按 F6），点"确定"后自动写入本文件并立即生效。
# 没有任何方案时所有角色都按原版成长。手动修改后在游戏中按 F7 重新读取。
#
# 规则：
#   1 级 8 项（含感应）总和 = 原版 1 级总和；2~15 级每级新增点 = 原版该级新增点，只加不减
#   感应只能在 1 级分配；减少的感应从 15 级起倒序逐级返还，增加感应需先减少 1 级其他属性
#   每项属性不低于 1、不高于 70（nr_stat_alloc.toml 的 [rules]）
#   vessel 不写为该角色默认方案；写器皿名则只在装备该器皿时生效（优先于默认方案）
