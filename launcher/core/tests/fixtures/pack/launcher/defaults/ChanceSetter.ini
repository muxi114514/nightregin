; ============================================================
; MAP CHANCES
; This should add up to 100.
; ============================================================

[mapChances]
; false = use the currently loaded game/mod map odds as the starting odds
; true  = use the percentages below
enabled = true

Standard     = 65
Mountaintop  = 7
TheCrater    = 7
RottedWoods  = 7
GreatHollow  = 7
ShroudedCity = 7

; If Nightlord odds and map odds conflict, Nightlord odds take priority and
; invalid map choices are ignored.
; This can happen sometimes in vanilla Nightreign, since FromSoft did not include the Great Hollow for every Nightlord.
; Mods like 'More Map Variations' can allow all Nightlords in the Great Hollow.


; ============================================================
; SHIFTING EARTH DROUGHT PROTECTION
; ============================================================

[shiftingEarthDroughtProtection]
enabled = true

; Drought protection makes Shifting Earths more likely after repeated Standard maps.

; No bonus is applied until you have at least this many Standard maps in a row.
startAfterStandardStreak = 3

; After the streak starts, add this many percentage points to the total
; Shifting Earth chance for each Standard map in the streak.
;
; Example:
; If Standard is 75% and total Shifting Earth chance is 25%, then with
; startAfterStandardStreak = 3 and extraShiftingEarthChancePerStandard = 5:
;   after 1 Standard: no change
;   after 2 Standards: no change
;   after 3 Standards: Shifting Earths are collectively 5% more likely to appear, for 30% total
;   after 4 Standards: Shifting Earths are collectively 10% more likely to appear, for 35% total
extraShiftingEarthChancePerStandard = 5

; Standard map will not go below this chance unless allowGuaranteedShiftingEarth = true.
minimumStandardChance = 20

; false = Standard always keeps at least minimumStandardChance
; true  = a long enough Standard streak can force the next map to be a Shifting Earth
allowGuaranteedShiftingEarth = false


; ============================================================
; NIGHTLORD REPEAT PROTECTION
; ============================================================

[nightlordRepeatProtection]
enabled = true

; bossReached, bossKilled, expeditionStarted
countRunsWhen = bossReached

; false = normal and Everdark versions count as the same Nightlord
; true  = Everdark versions are counted separately
treatEverdarkAsDifferentNightlord = false

; Percent of the current chance to keep for recent Nightlords.
;
; 0   = blocked completely
; 50  = keeps half of its normal chance
; 100 = unchanged
;
; Example:
; If Gladius normally has a 10% chance and mostRecent = 50,
; Gladius is reduced to a 5% chance for the next expedition.
mostRecent    = 0
secondRecent  = 50
thirdRecent   = 75
fourthRecent  = 100
fifthRecent   = 100
sixthRecent   = 100
seventhRecent = 100
eighthRecent  = 100
ninthRecent   = 100


; ============================================================
; SHIFTING EARTH REPEAT PROTECTION
; ============================================================

; Mostly useful if your Shifting Earth chances are set very high and you are tired of
; seeing the same one repeatedly. Disabled by default.

[shiftingEarthRepeatProtection]
enabled = false

; When to consider an expedition for repeat protection:
; expeditionStarted, bossReached, bossKilled
countRunsWhen = expeditionStarted

; true = Standard clears the previous Shifting Earth repeat state
; Example: true allows Standard -> Crater -> Standard -> Crater
standardResetsRepeatProtection = true

; Percent of the current chance to keep for recent Shifting Earths.
;
; 0   = blocked completely
; 50  = keeps half of its normal chance
; 100 = unchanged
;
; Standard is not affected by this setting.
mostRecent   = 50
secondRecent = 100
thirdRecent  = 100
fourthRecent = 100
