; ChanceSetter v1.0
;
; Put this file next to ChanceSetter.dll.
; Logs are written to the sibling dll\logs folder as chance_setter_YYYY_MM_DD.log.
; Odds are applied when an expedition roll starts.
; A value of 0 means that option is disabled unless the mod must use a safe fallback due to invalid combinations.

configVersion = 10


; ============================================================
; BASIC SETTINGS
; ============================================================

[general]
enabled = true

; normal  = short summaries
; verbose = detailed troubleshooting logs
logLevel = normal


[save]
; auto = scan each folder directly under %APPDATA%\Nightreign for the newest
; save file matching autoExtension.
; You can also set an exact save path instead.
;
; example for exact path:
; path = C:\Users\ManiacMike\AppData\Roaming\Nightreign\0123456789101112\CL_NR0000.sl2
path = auto

; File type used only when path = auto. A leading dot is optional.
; Seamless Coop uses .co2 by default
; Server Redirector uses .CL_SAVE by default
; Standard extension is .sl2
; Old versions of MMV/Daybreak used .co2, but now use .dbb instead
; When using with another me3 mod, check your .me3 file for the save extension being used, they should match
autoExtension = .CL_SAVE


